all:
  vars:
    ansible_user: vagrant
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

loadbalancer:
  hosts:
    loadbalancer_host_01:
      ansible_host: 127.0.0.1
      ansible_port: 2222
      ansible_ssh_private_key_file: .vagrant/machines/loadbalancer/virtualbox/private_key

webservers:
  hosts:
    webserver_host_01:
      ansible_host: 127.0.0.1
      ansible_port: 2200
      ansible_ssh_private_key_file: .vagrant/machines/web1/virtualbox/private_key
    webserver_host_02:
      ansible_host: 127.0.0.1
      ansible_port: 2201
      ansible_ssh_private_key_file: .vagrant/machines/web2/virtualbox/private_key

app:
  hosts:
    app_host_01:
      ansible_host: 127.0.0.1
      ansible_port: 2202
      ansible_ssh_private_key_file: .vagrant/machines/app/virtualbox/private_key

cicd:
  hosts:
    cicd_host_01:
      ansible_host: 127.0.0.1
      ansible_port: 2203
      ansible_ssh_private_key_file: .vagrant/machines/cicd/virtualbox/private_key
