---
- name: Verify application server can reach local registry
  ansible.builtin.uri:
    url: http://192.168.56.14:5000/v2/
    status_code: 200
  register: app_registry_health
  until: app_registry_health.status == 200
  retries: 10
  delay: 2
  changed_when: false

- name: Read jenkins deployment public key
  ansible.builtin.slurp:
    src: /opt/cicd/jenkins_home/.ssh/id_ed25519.pub
  delegate_to: "{{ groups['cicd'][0] }}"
  run_once: true
  register: jenkins_deployment_public_key
  changed_when: false

- name: Authorize jenkins deployment public key for deploy user
  ansible.posix.authorized_key:
    user: deploy
    key: "{{ jenkins_deployment_public_key.content | b64decode }}"
    state: present
    manage_dir: true

- name: Verify jenkins can connect to application server as deploy
  ansible.builtin.command: >-
    docker exec jenkins ssh -i /var/jenkins_home/.ssh/id_ed25519
    -o BatchMode=yes -o IdentitiesOnly=yes
    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    deploy@192.168.56.13 true
  delegate_to: "{{ groups['cicd'][0] }}"
  run_once: true
  changed_when: false
