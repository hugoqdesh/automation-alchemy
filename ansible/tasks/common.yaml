---
- name: Update apt cache
  ansible.builtin.apt: { update_cache: true, cache_valid_time: 3600 }
- name: Install common packages
  ansible.builtin.apt:
    name: [curl, git, unzip, ufw, openssh-client, openssh-server]
    state: present
- name: Create deploy user
  ansible.builtin.user:
    { name: deploy, shell: /bin/bash, create_home: true, state: present }
- name: Disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart ssh
- name: Disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart ssh
- name: Allow ssh through firewall
  community.general.ufw: { rule: allow, port: "22", proto: tcp }
- name: Enable firewall
  community.general.ufw: { state: enabled, policy: deny, direction: incoming }
