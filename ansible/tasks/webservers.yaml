---
- name: Install frontend container tools
  ansible.builtin.apt:
    name: [docker.io, docker-compose-v2]
    state: present

- name: Start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Check installed services for an earlier host Nginx
  ansible.builtin.service_facts:

- name: Stop the previous host Nginx service
  ansible.builtin.service:
    name: nginx
    state: stopped
    enabled: false
  when: "'nginx.service' in ansible_facts.services"

- name: Remove unrestricted web traffic rule
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    delete: true

- name: Allow web requests from the load balancer
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    src: 192.168.56.10

- name: Create frontend directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: [/opt/frontend, /opt/frontend/html, /opt/frontend/nginx]

- name: Install the metrics dashboard
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../frontend/index.html"
    dest: /opt/frontend/html/index.html
    mode: "0644"

- name: Configure frontend reverse proxy
  ansible.builtin.copy:
    dest: /opt/frontend/nginx/default.conf
    mode: "0644"
    content: |
      server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;
          add_header X-Served-By {{ vm_name }} always;
          location / { try_files $uri $uri/ =404; }
          location /api/ {
              proxy_pass http://192.168.56.13:3000/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }
      }
  register: frontend_nginx

- name: Configure frontend container
  ansible.builtin.copy:
    dest: /opt/frontend/compose.yaml
    mode: "0644"
    content: |
      services:
        frontend:
          image: nginx:stable-alpine
          container_name: frontend
          restart: unless-stopped
          network_mode: host
          volumes:
            - /opt/frontend/html:/usr/share/nginx/html:ro
            - /opt/frontend/nginx:/etc/nginx/conf.d:ro

- name: Start frontend container
  ansible.builtin.command: docker compose -f /opt/frontend/compose.yaml up --detach
  register: frontend_start
  changed_when: "'Started' in frontend_start.stderr or 'Created' in frontend_start.stderr or 'Recreated' in frontend_start.stderr"

- name: Validate frontend configuration
  ansible.builtin.command: docker exec frontend nginx -t
  changed_when: false

- name: Reload changed frontend configuration
  ansible.builtin.command: docker exec frontend nginx -s reload
  when: frontend_nginx.changed and not frontend_start.changed

- name: Verify frontend serves its dashboard
  ansible.builtin.uri:
    url: http://127.0.0.1/
    status_code: 200
