all:
  vars:
    ansible_user: devops
    ansible_ssh_private_key_file: "{{ inventory_dir }}/../.local/devops_ed25519"
    local_secrets: "{{ lookup('file', inventory_dir + '/../.local/credentials.json') | from_json }}"
    ansible_become_password: "{{ local_secrets.devops_password }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

loadbalancer:
  hosts:
    loadbalancer_host_01:
      ansible_host: 127.0.0.1
      ansible_port: 2222
      vm_name: loadbalancer

webservers:
  hosts:
    webserver_host_01:
      ansible_host: 127.0.0.1
      ansible_port: 2200
      vm_name: web1
    webserver_host_02:
      ansible_host: 127.0.0.1
      ansible_port: 2201
      vm_name: web2

app:
  hosts:
    app_host_01:
      ansible_host: 127.0.0.1
      ansible_port: 2202
      vm_name: app

cicd:
  hosts:
    cicd_host_01:
      ansible_host: 127.0.0.1
      ansible_port: 2203
      vm_name: cicd
