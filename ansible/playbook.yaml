# ====================
# COMMON CONFIGURATION
# ====================

- name: Configure all servers
  hosts: all
  become: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install common packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - unzip
          - ufw
          - openssh-client
          - openssh-server
        state: present

    - name: Create deploy user
      ansible.builtin.user:
        name: deploy
        shell: /bin/bash
        create_home: true
        state: present

    - name: Disable root login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin"
        line: "PermitRootLogin no"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Restart ssh

    - name: Disable password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Restart ssh

    - name: Allow ssh through firewall
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Enable firewall
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

# =============
# LOAD BALANCER
# =============

- name: Configure load balancer
  hosts: loadbalancer
  become: true

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Allow http through firewall
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Configure nginx load balancer
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/loadbalancer
        mode: "0644"
        content: |
          upstream webservers {
              server 192.168.56.11;
              server 192.168.56.12;
          }

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://webservers;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Reload nginx

    - name: Enable load balancer conf
      ansible.builtin.file:
        src: /etc/nginx/sites-available/loadbalancer
        dest: /etc/nginx/sites-enabled/loadbalancer
        state: link
        force: true
      notify: Reload nginx

    - name: Remove default nginx conf
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Verify load balancer nginx is active
      ansible.builtin.command: systemctl is-active nginx
      changed_when: false

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

# ===========
# WEB SERVERS
# ===========

- name: Configure web servers
  hosts: webservers
  become: true

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Allow http through firewall
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Create web directory
      ansible.builtin.file:
        path: /var/www/app
        state: directory
        owner: deploy
        group: deploy
        mode: "0755"

    - name: Create temporary application page
      ansible.builtin.copy:
        dest: /var/www/app/index.html
        owner: deploy
        group: deploy
        mode: "0644"
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Automation Alchemy</title>
          </head>
          <body>
              <h1>Web server is running</h1>
              <p>Hostname: {{ inventory_hostname }}</p>
          </body>
          </html>

    - name: Configure web server
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/app
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name _;

              root /var/www/app;
              index index.html;

              location / {
                  try_files $uri $uri/ =404;
              }

              location /api/ {
                  proxy_pass http://192.168.56.13:3000/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }
      notify: Reload nginx

    - name: Enable web server conf
      ansible.builtin.file:
        src: /etc/nginx/sites-available/app
        dest: /etc/nginx/sites-enabled/app
        state: link
        force: true
      notify: Reload nginx

    - name: Remove default nginx conf
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Verify web server nginx is active
      ansible.builtin.command: systemctl is-active nginx
      changed_when: false

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

# ==================
# APPLICATION SERVER
# ==================

- name: Configure application server
  hosts: app
  become: true

  tasks:
    - name: Install docker
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Add deploy user to docker group
      ansible.builtin.user:
        name: deploy
        groups: docker
        append: true

    - name: Start docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Trust local docker registry
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "insecure-registries": ["192.168.56.14:5000"]
          }
      notify: Restart docker

    - name: Apply docker registry configuration
      ansible.builtin.meta: flush_handlers

    - name: Verify docker is active
      ansible.builtin.command: systemctl is-active docker
      changed_when: false

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/app
        state: directory
        owner: deploy
        group: deploy
        mode: "0755"

    - name: Create deployment directory
      ansible.builtin.file:
        path: /opt/app/releases
        state: directory
        owner: deploy
        group: deploy
        mode: "0755"

    - name: Configure application deployment service
      ansible.builtin.copy:
        dest: /opt/app/compose.yaml
        owner: deploy
        group: deploy
        mode: "0644"
        content: |
          services:
            diagnostic-app:
              container_name: diagnostic-app
              image: ${APP_IMAGE:?APP_IMAGE must be an immutable Git-SHA image reference}
              network_mode: host
              restart: unless-stopped

    - name: Create application deployment script
      ansible.builtin.copy:
        dest: /opt/app/deploy.sh
        owner: root
        group: deploy
        mode: "0750"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail

          app_image="${1:?usage: deploy.sh <immutable-image-reference>}"
          expected_pattern='^192\.168\.56\.14:5000/diagnostic-app:[a-f0-9]{40}$'
          if [[ ! "$app_image" =~ $expected_pattern ]]; then
            echo "APP_IMAGE must use the local registry and a full Git SHA tag" >&2
            exit 2
          fi

          umask 077
          printf 'APP_IMAGE=%s\n' "$app_image" > /opt/app/release.env
          docker compose --env-file /opt/app/release.env \
            --file /opt/app/compose.yaml up --detach

    - name: Create application release health-check script
      ansible.builtin.copy:
        dest: /opt/app/verify-release.sh
        owner: root
        group: deploy
        mode: "0750"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail

          test -r /opt/app/release.env
          source /opt/app/release.env
          expected_pattern='^192\.168\.56\.14:5000/diagnostic-app:[a-f0-9]{40}$'
          if [[ ! "${APP_IMAGE:-}" =~ $expected_pattern ]]; then
            echo "release.env does not contain an immutable application image" >&2
            exit 2
          fi

          running_image="$(docker inspect --format '{{ "{{" }}.Config.Image{{ "}}" }}' diagnostic-app)"
          test "$running_image" = "$APP_IMAGE"
          curl --fail --silent --show-error http://127.0.0.1:3000/health

    - name: Create application SSH directory
      ansible.builtin.file:
        path: /home/deploy/.ssh
        state: directory
        owner: deploy
        group: deploy
        mode: "0700"

    - name: Remove broad application port rule
      community.general.ufw:
        rule: allow
        port: "3000"
        proto: tcp
        src: "192.168.56.0/24"
        delete: true

    - name: Allow application port from web servers only
      community.general.ufw:
        rule: allow
        port: "3000"
        proto: tcp
        src: "{{ item }}"
      loop:
        - "192.168.56.11"
        - "192.168.56.12"

  handlers:
    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted

# ============
# CI/CD SERVER
# ============

- name: Configure ci/cd server
  hosts: cicd
  become: true

  tasks:
    - name: Install docker
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Add deploy user to docker group
      ansible.builtin.user:
        name: deploy
        groups: docker
        append: true

    - name: Start docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Trust local docker registry
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "insecure-registries": ["192.168.56.14:5000"]
          }
      notify: Restart Docker

    - name: Apply Docker registry configuration
      ansible.builtin.meta: flush_handlers

    - name: Verify Docker is active
      ansible.builtin.command: systemctl is-active docker
      changed_when: false

    - name: Create ci/cd directory
      ansible.builtin.file:
        path: /opt/cicd
        state: directory
        owner: deploy
        group: deploy
        mode: "0755"

    - name: Create registry directory
      ansible.builtin.file:
        path: /opt/cicd/registry
        state: directory
        owner: deploy
        group: deploy
        mode: "0755"

    - name: Create Jenkins data directory
      ansible.builtin.file:
        path: /opt/cicd/jenkins_home
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0750"

    - name: Create jenkins ssh directory
      ansible.builtin.file:
        path: /opt/cicd/jenkins_home/.ssh
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0700"

    - name: Generate jenkins deployment key
      ansible.builtin.command:
        cmd: >-
          ssh-keygen -t ed25519 -N '' -f
          /opt/cicd/jenkins_home/.ssh/id_ed25519
        creates: /opt/cicd/jenkins_home/.ssh/id_ed25519

    - name: Set jenkins deployment private-key permissions
      ansible.builtin.file:
        path: /opt/cicd/jenkins_home/.ssh/id_ed25519
        owner: "1000"
        group: "1000"
        mode: "0600"

    - name: Set Jenkins deployment public-key permissions
      ansible.builtin.file:
        path: /opt/cicd/jenkins_home/.ssh/id_ed25519.pub
        owner: "1000"
        group: "1000"
        mode: "0644"

    - name: Create jenkins image definition
      ansible.builtin.copy:
        dest: /opt/cicd/Dockerfile
        owner: deploy
        group: deploy
        mode: "0644"
        content: |
          FROM jenkins/jenkins:lts-jdk17
          USER root
          RUN apt-get update \
              && apt-get install --no-install-recommends -y docker.io \
              && rm -rf /var/lib/apt/lists/*
          USER jenkins

    - name: Read docker socket group ID
      ansible.builtin.command: stat --format=%g /var/run/docker.sock
      register: docker_socket_gid
      changed_when: false

    - name: Configure jenkins and the local image registry
      ansible.builtin.copy:
        dest: /opt/cicd/compose.yaml
        owner: deploy
        group: deploy
        mode: "0644"
        content: |
          services:
            jenkins:
              build:
                context: .
              container_name: jenkins
              restart: unless-stopped
              ports:
                - "8080:8080"
              volumes:
                - /opt/cicd/jenkins_home:/var/jenkins_home
                - /var/run/docker.sock:/var/run/docker.sock
              group_add:
                - "{{ docker_socket_gid.stdout }}"

            registry:
              image: registry:2
              container_name: local-registry
              restart: unless-stopped
              network_mode: host
              volumes:
                - /opt/cicd/registry:/var/lib/registry

    - name: Start jenkins and the local image registry
      ansible.builtin.command:
        cmd: docker compose -f /opt/cicd/compose.yaml up --build --detach
        chdir: /opt/cicd
      changed_when: false

    - name: Wait for jenkins to become ready
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/login
        status_code: 200
      register: jenkins_health
      until: jenkins_health.status == 200
      retries: 30
      delay: 2
      changed_when: false

    - name: Verify local docker registry is ready
      ansible.builtin.uri:
        url: http://127.0.0.1:5000/v2/
        status_code: 200
      register: registry_health
      until: registry_health.status == 200
      retries: 10
      delay: 2
      changed_when: false

    - name: Allow jenkins web interface
      community.general.ufw:
        rule: allow
        port: "8080"
        proto: tcp

    - name: Remove broad docker registry rule
      community.general.ufw:
        rule: allow
        port: "5000"
        proto: tcp
        src: "192.168.56.0/24"
        delete: true

    - name: Allow docker registry
      community.general.ufw:
        rule: allow
        port: "5000"
        proto: tcp
        src: "{{ item }}"
      loop:
        - "192.168.56.13"
        - "192.168.56.14"

  handlers:
    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted

# =============================
# JENKINS DEPLOYMENT SSH ACCESS
# =============================

- name: Authorize jenkins deployment key on application server
  hosts: app
  become: true

  tasks:
    - name: Read jenkins deployment public key
      ansible.builtin.slurp:
        src: /opt/cicd/jenkins_home/.ssh/id_ed25519.pub
      delegate_to: "{{ groups['cicd'][0] }}"
      run_once: true
      register: jenkins_deployment_public_key
      changed_when: false

    - name: Authorize jenkins deployment public key for deploy user
      ansible.builtin.lineinfile:
        path: /home/deploy/.ssh/authorized_keys
        line: "{{ jenkins_deployment_public_key.content | b64decode }}"
        create: true
        owner: deploy
        group: deploy
        mode: "0600"
