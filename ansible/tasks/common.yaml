---
- name: Refresh package lists and install available updates
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist

- name: Install common packages
  ansible.builtin.apt:
    name: [curl, git, unzip, ufw, openssh-client, openssh-server]
    state: present

- name: Resolve every infrastructure hostname
  ansible.builtin.blockinfile:
    path: /etc/hosts
    block: |
      192.168.56.10 loadbalancer
      192.168.56.11 web1
      192.168.56.12 web2
      192.168.56.13 app
      192.168.56.14 cicd

- name: Enforce key-only SSH for devops
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-automation.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      AllowUsers devops
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
  notify: Restart ssh

- name: Ensure SSH runtime directory exists after package upgrades
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Validate SSH configuration before restarting
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Ensure SSH service is enabled
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true

- name: Configure secure login file permissions
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^UMASK\s+'
    line: "UMASK 027"

- name: Set secure umask for login shells
  ansible.builtin.copy:
    dest: /etc/profile.d/umask.sh
    mode: "0644"
    content: "umask 027\n"

- name: Set secure umask for interactive non-login shells
  ansible.builtin.lineinfile:
    path: /etc/bash.bashrc
    line: umask 027

- name: Allow SSH through firewall
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Enable firewall
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Apply SSH restrictions
  ansible.builtin.meta: flush_handlers

- name: Check whether installed updates require a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot to activate installed updates
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: reboot_required.stat.exists
