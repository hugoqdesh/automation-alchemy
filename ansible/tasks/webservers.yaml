---
- name: Install nginx
  ansible.builtin.apt: { name: nginx, state: present }
- name: Allow http through firewall
  community.general.ufw: { rule: allow, port: "80", proto: tcp }
- name: Create web directory
  ansible.builtin.file:
    {
      path: /var/www/app,
      state: directory,
      owner: deploy,
      group: deploy,
      mode: "0755",
    }
- name: Create temporary application page
  ansible.builtin.copy:
    dest: /var/www/app/index.html
    owner: deploy
    group: deploy
    mode: "0644"
    content: |
      <!DOCTYPE html>
      <html><head><title>Automation Alchemy</title></head>
      <body><h1>Web server is running</h1><p>Hostname: {{ inventory_hostname }}</p></body></html>
- name: Configure web server
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/app
    mode: "0644"
    content: |
      server {
          listen 80;
          server_name _;
          root /var/www/app;
          index index.html;
          location / { try_files $uri $uri/ =404; }
          location /api/ {
              proxy_pass http://192.168.56.13:3000/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }
      }
  notify: Reload nginx
- name: Enable web server conf
  ansible.builtin.file:
    {
      src: /etc/nginx/sites-available/app,
      dest: /etc/nginx/sites-enabled/app,
      state: link,
      force: true,
    }
  notify: Reload nginx
- name: Remove default nginx conf
  ansible.builtin.file:
    { path: /etc/nginx/sites-enabled/default, state: absent }
  notify: Reload nginx
- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
- name: Ensure nginx is running
  ansible.builtin.service: { name: nginx, state: started, enabled: true }
- name: Verify web server nginx is active
  ansible.builtin.command: systemctl is-active nginx
  changed_when: false
